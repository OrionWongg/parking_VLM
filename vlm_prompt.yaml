api_key: ""
base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
model: "qwen3.6-plus"
enable_thinking: false

system_prompt: |

user_prompt: |
  你是停车场车牌识别专家。请分析图片中的车牌，严格按照JSON格式输出结果。

  车牌规则：
  - 蓝牌：7位（1位省份汉字 + 1位地市字母 + 5位字母/数字）
  - 新能源牌：8位（1位省份汉字 + 1位地市字母 + 6位字母/数字）
  - 车牌中不会出现字母O和I，可能是数字0和1
  - 字符须清晰、完整、无遮挡

  识别时可能会出现车牌不完整的情况

  请分析图片并仅输出以下JSON，不要输出其他内容：
  {
    "车牌情况": "车牌完整 或 车牌不完整 或 无牌",
    "车牌号码": "识别出的完整车牌号（如能识别出），其他情况则为空字符串",
    "异常原因": "逃费 或 车牌不完整 或 无牌车"
  }
  示例：
  {
  "车牌情况": "车牌完整",
  "车牌号码": "贵G12345",
  "异常原因": "逃费"
  }

  判断标准：
  - 车牌完整且符合格式规则 → 车牌情况="车牌完整"，异常原因="逃费"
  - 车牌部分可见/被截断/被遮挡 → 车牌情况="车牌不完整"，异常原因="车牌不完整"
  - 无车牌/未安装车牌 → 车牌情况="无牌"，异常原因="无牌车"

  只输出JSON，不要输出解释文字。
