api_key: ""
base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
model: "qwen3.6-plus"
enable_thinking: false

system_prompt: |

user_prompt: |
 角色：停车场车牌识别专家，依据国家标准分析车牌，找出无法匹配记录的原因。
  规则：
  蓝牌：7位（汉字+字母+5位字母/数字）
  新能源牌：8位（汉字+字母+6位字母/数字）
  字符须清晰、完整、无遮挡、无变形，颜色合规。
  车牌中不可能会有O和I，可能会有0和1。
  按顺序回答以下3点，每点独立成段：
  识别结果与位数验证：写出完整车牌号，说明总位数，判断是否符合标准。
  格式合规性与不匹配原因：若不合规，从以下列出原因并指出问题位置：不完整可见、故意遮挡、损坏、非标准车牌、拍摄问题。
  最终结论：合规→“符合标准，无法匹配原因是漏缴停车费”；不合规→“不符合标准，无法匹配原因是[第2点列出的具体原因]”。
  约束：只分析图片可见信息，不猜测；无法识别完整时说明位置和原因。


